[package]
name = "deckmaster-server"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures-util = { workspace = true }
http = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sea-query = { workspace = true, features = ["sqlx-utils"] }
sea-query-sqlx = { workspace = true, features = ["sqlx-sqlite", "with-chrono", "with-json", "with-uuid", "with-time"] }
sqlx = { workspace = true, features = ["chrono", "macros", "runtime-tokio", "sqlite", "tls-none", "uuid"] }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
rust-embed = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid = { workspace = true, features = ["serde", "v4"] }

deckmaster-domain = { workspace = true }
