[workspace]
members = [
    "src/domain",
    "src/server",
]

default-members = [
    "src/server"
]

resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
chrono = "0.4"
futures-util = "0.3"
http = "1.3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false }
rust-embed = "8.7"
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false }
tokio = "1.42"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = "0.6"
utoipa = "5.4"
utoipa-swagger-ui = "9.0"
uuid = "1"

deckmaster-domain = { path = "src/domain" }
